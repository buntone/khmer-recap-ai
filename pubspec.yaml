name: khmer_recap_ai
description: "AI-Powered Khmer Movie Recap Generator for Android - Multimodal Video Analysis, Khmer Voiceover & Video Muxing"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  google_generative_ai: ^0.4.6
  ffmpeg_kit_flutter_new: ^4.6.3
  image_picker: ^1.0.7
  video_player: ^2.8.2
  chewie: ^1.7.5
  http: ^1.2.0
  path_provider: ^2.1.2
  path: ^1.9.0
  permission_handler: ^11.3.0
  shared_preferences: ^2.2.2
  share_plus: ^10.1.4
  audioplayers: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
